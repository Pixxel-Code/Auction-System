<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="47" fill="#0D1018" stroke="#C8922A" stroke-width="2.5"/>
  <!-- Inner subtle ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#C8922A" stroke-width="0.6" opacity="0.4"/>
  <!-- Shield body -->
  <path d="M50,18 L76,30 L76,54 Q76,76 50,88 Q24,76 24,54 L24,30 Z" fill="#151E30" stroke="#C8922A" stroke-width="2"/>
  <!-- Shield inner highlight -->
  <path d="M50,23 L71,33 L71,54 Q71,72 50,83 Q29,72 29,54 L29,33 Z" fill="none" stroke="#C8922A" stroke-width="0.5" opacity="0.3"/>
  <!-- A monogram -->
  <text x="50" y="67" font-family="Trebuchet MS, serif" font-size="38" font-weight="700" fill="#C8922A" text-anchor="middle">A</text>
  <!-- Crown dots top of shield -->
  <circle cx="36" cy="24" r="3.5" fill="#F0C060"/>
  <circle cx="50" cy="19" r="3.5" fill="#F0C060"/>
  <circle cx="64" cy="24" r="3.5" fill="#F0C060"/>
  <!-- Tiny star accents -->
  <circle cx="36" cy="24" r="1.5" fill="#FFE090"/>
  <circle cx="50" cy="19" r="1.5" fill="#FFE090"/>
  <circle cx="64" cy="24" r="1.5" fill="#FFE090"/>
</svg>
